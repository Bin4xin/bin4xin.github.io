
<!-- Lightbox DOM -->
<div class="lb-overlay" id="lb-overlay">
<button class="lb-close" id="lb-close"><i class="fas fa-times"></i></button>
<button class="lb-arrow lb-prev" id="lb-prev"><i class="fas fa-chevron-left"></i></button>
<button class="lb-arrow lb-next" id="lb-next"><i class="fas fa-chevron-right"></i></button>
<img class="lb-img" id="lb-img" src="" alt="" draggable="false">
<span class="lb-counter" id="lb-counter"></span>
<div class="lb-zoom">
    <button class="lb-zoom-btn" id="lb-zoom-out"><i class="fas fa-minus"></i></button>
    <span class="lb-zoom-level" id="lb-zoom-level">100%</span>
    <button class="lb-zoom-btn" id="lb-zoom-in"><i class="fas fa-plus"></i></button>
    <button class="lb-zoom-btn" id="lb-zoom-reset"><i class="fas fa-expand"></i></button>
</div>
</div>

<script>
(function(){
var overlay   = document.getElementById('lb-overlay');
var img       = document.getElementById('lb-img');
var btnClose  = document.getElementById('lb-close');
var btnPrev   = document.getElementById('lb-prev');
var btnNext   = document.getElementById('lb-next');
var counter   = document.getElementById('lb-counter');
var zoomIn    = document.getElementById('lb-zoom-in');
var zoomOut   = document.getElementById('lb-zoom-out');
var zoomReset = document.getElementById('lb-zoom-reset');
var zoomLevel = document.getElementById('lb-zoom-level');

var images = [];
var idx    = 0;
var scale  = 1;
var posX   = 0;
var posY   = 0;

// ── Collect all clickable images (with src dedup) ──
  function collectImages(){
    var containers = document.querySelectorAll('#help-content, .markdown-body-img, .post-content, .article-content, .ct-card__body, .lb-target');
    images = [];
    var seen = {};

    containers.forEach(function(c){
      c.querySelectorAll('img').forEach(function(im){
        if(im.getAttribute('data-lb-ignore')) return;
        if(im.getAttribute('width') && parseInt(im.getAttribute('width')) < 60) return;
        if(im.getAttribute('height') && parseInt(im.getAttribute('height')) < 60) return;
        if(images.indexOf(im) !== -1) return;

        var key = im.getAttribute('data-src') || im.src;
        if(seen[key]) return;
        seen[key] = true;

        images.push(im);
        im.addEventListener('click', function(e){
          e.preventDefault();
          openAt(im);
        });
      });
    });

    // Also catch any img with class "lb-clickable"
    document.querySelectorAll('img.lb-clickable').forEach(function(im){
      if(images.indexOf(im) === -1){
        images.push(im);
        im.addEventListener('click', function(e){
          e.preventDefault();
          openAt(im);
        });
      }
    });
  }

// ── Open at specific image ──
function openAt(targetImg){
    idx = images.indexOf(targetImg);
    if(idx === -1) idx = 0;
    showImage();
    overlay.classList.add('is-active');
    document.body.style.overflow = 'hidden';
}

// ── Show image at current index ──
function showImage(){
    if(!images[idx]) return;
    var src = images[idx].getAttribute('data-src') || images[idx].src;
    img.src = src;
    img.alt = images[idx].alt || '';
    counter.textContent = (idx + 1) + ' / ' + images.length;
    btnPrev.style.display = images.length > 1 ? '' : 'none';
    btnNext.style.display = images.length > 1 ? '' : 'none';
    resetZoom();
}

// ── Close ──
function close(){
    overlay.classList.remove('is-active');
    document.body.style.overflow = '';
    resetZoom();
}

// ── Navigate ──
function goPrev(){
    if(images.length <= 1) return;
    idx = (idx - 1 + images.length) % images.length;
    showImage();
}
function goNext(){
    if(images.length <= 1) return;
    idx = (idx + 1) % images.length;
    showImage();
}

// ── Zoom ──
function applyZoom(){
    img.style.transform = 'scale(' + scale + ') translate(' + posX + 'px, ' + posY + 'px)';
    zoomLevel.textContent = Math.round(scale * 100) + '%';
}
function zoomTo(s){
    scale = Math.max(0.5, Math.min(5, s));
    if(scale === 1){ posX = 0; posY = 0; }
    applyZoom();
}
function resetZoom(){
    scale = 1; posX = 0; posY = 0;
    applyZoom();
}

// ── Drag when zoomed ──
var dragging = false, dragStartX, dragStartY, startPosX, startPosY;

img.addEventListener('mousedown', function(e){
    if(scale <= 1) return;
    e.preventDefault();
    dragging = true;
    img.classList.add('is-dragging');
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    startPosX  = posX;
    startPosY  = posY;
});
document.addEventListener('mousemove', function(e){
    if(!dragging) return;
    posX = startPosX + (e.clientX - dragStartX) / scale;
    posY = startPosY + (e.clientY - dragStartY) / scale;
    applyZoom();
});
document.addEventListener('mouseup', function(){
    dragging = false;
    img.classList.remove('is-dragging');
});

// Mouse wheel zoom
overlay.addEventListener('wheel', function(e){
    if(!overlay.classList.contains('is-active')) return;
    e.preventDefault();
    var delta = e.deltaY > 0 ? -0.15 : 0.15;
    zoomTo(scale + delta);
}, { passive: false });

// Pinch zoom (touch)
var lastTouchDist = 0;
overlay.addEventListener('touchstart', function(e){
    if(e.touches.length === 2){
    var dx = e.touches[0].clientX - e.touches[1].clientX;
    var dy = e.touches[0].clientY - e.touches[1].clientY;
    lastTouchDist = Math.sqrt(dx * dx + dy * dy);
    }
}, { passive: true });
overlay.addEventListener('touchmove', function(e){
    if(e.touches.length === 2){
    e.preventDefault();
    var dx = e.touches[0].clientX - e.touches[1].clientX;
    var dy = e.touches[0].clientY - e.touches[1].clientY;
    var dist = Math.sqrt(dx * dx + dy * dy);
    var delta = (dist - lastTouchDist) * 0.008;
    lastTouchDist = dist;
    zoomTo(scale + delta);
    }
}, { passive: false });

// Double-click to toggle zoom
img.addEventListener('dblclick', function(e){
    e.preventDefault();
    if(scale > 1){
    resetZoom();
    } else {
    zoomTo(2.5);
    }
});

// ── Swipe navigation (touch) ──
var touchStartX = 0, touchStartY = 0, swiping = false;
img.addEventListener('touchstart', function(e){
    if(e.touches.length !== 1 || scale > 1) return;
    swiping = true;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
}, { passive: true });
img.addEventListener('touchend', function(e){
    if(!swiping) return;
    swiping = false;
    var dx = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(dx) > 60){
    dx > 0 ? goPrev() : goNext();
    }
}, { passive: true });

// ── Keyboard ──
document.addEventListener('keydown', function(e){
    if(!overlay.classList.contains('is-active')) return;
    switch(e.key){
    case 'Escape':  close(); break;
    case 'ArrowLeft':  goPrev(); break;
    case 'ArrowRight': goNext(); break;
    case '+': case '=': zoomTo(scale + 0.2); break;
    case '-': zoomTo(scale - 0.2); break;
    case '0': resetZoom(); break;
    }
});

// ── Click events ──
overlay.addEventListener('click', function(e){
    if(e.target === overlay) close();
});
btnClose.addEventListener('click', close);
btnPrev.addEventListener('click', function(e){ e.stopPropagation(); goPrev(); });
btnNext.addEventListener('click', function(e){ e.stopPropagation(); goNext(); });
zoomIn.addEventListener('click', function(e){ e.stopPropagation(); zoomTo(scale + 0.25); });
zoomOut.addEventListener('click', function(e){ e.stopPropagation(); zoomTo(scale - 0.25); });
zoomReset.addEventListener('click', function(e){ e.stopPropagation(); resetZoom(); });

// ── Init ──
if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', collectImages);
} else {
    collectImages();
}
})();
</script>
