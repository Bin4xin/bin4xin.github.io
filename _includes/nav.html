<div role="navigation">
    <nav class="sentinel-nav">
        <div class="sentinel-nav-inner">

          <!-- Brand -->
          <a class="sentinel-nav-brand" href="{{ '/' | relative_url }}">
            <i class="fas fa-hat-cowboy-side sentinel-nav-logo"></i>
            <span class="sentinel-nav-name">{{ site.brand | default: site.title }}</span>
          </a>

          <!-- Mobile toggle -->
          <button class="sentinel-nav-toggle" id="sentinel-nav-toggle" aria-label="Toggle navigation">
            <i class="fas fa-bars"></i>
          </button>

          <!-- Nav items -->
          <div class="sentinel-nav-list-wrap" id="sentinel-nav-list-wrap">
            <ul class="sentinel-nav-list">

              {% if site.harmony %}

                <li class="sentinel-nav-item {% if page.permalink == '/' %}active{% endif %}">
                  <a href="{{ '/news/index.htm' | prepend: site.harmonyURL }}" target="blank">
                    <i class="fas fa-landmark"></i> CNGONGJI.CN
                  </a>
                </li>
                <li class="sentinel-nav-item">
                  <a href="{{ '/news/ej.htm?page=zxzx' | prepend: site.harmonyURL }}" target="blank">
                    <i class="fas fa-newspaper"></i> News
                  </a>
                </li>
                <li class="sentinel-nav-item">
                  <a href="{{ '/news/ej.htm?page=ztbd' | prepend: site.harmonyURL }}" target="blank">
                    <i class="fas fa-tags"></i> Topics
                  </a>
                </li>

                <span class="sentinel-nav-sep"></span>

                <li class="sentinel-nav-item">
                  <a href="{{ '/news/ej.htm?page=tbch' | prepend: site.harmonyURL }}" target="blank">
                    <i class="fas fa-star"></i> Special Plan
                  </a>
                </li>
                <li class="sentinel-nav-item">
                  <a href="http://www.19371213.com.cn" target="blank">
                    <i class="fas fa-database"></i> Data Research
                  </a>
                </li>

                <span class="sentinel-nav-sep"></span>

                <li class="sentinel-nav-item">
                  <a href="{{ '/2016-11/29/c_135866990.htm' | prepend: site.harmonyURL }}" target="blank">
                    <i class="fas fa-envelope"></i> Contact Us
                  </a>
                </li>

              {% else %}

                <li class="sentinel-nav-item {% if page.permalink == '/' %}active{% endif %}">
                  <a href="{{ '/' | relative_url }}">
                    <i class="fas fa-home"></i> Home
                  </a>
                </li>
                <li class="sentinel-nav-item {% if page.permalink contains '/blog/' or page.categories contains 'blog' %}active{% endif %}">
                  <a href="{{ '/blog/' | relative_url }}">
                    <i class="fas fa-pen-nib"></i> Blog
                  </a>
                </li>
                <li class="sentinel-nav-item {% if page.permalink contains '/document/' %}active{% endif %}">
                  <a href="{{ '/document/' | relative_url }}">
                    <i class="fas fa-book-open"></i> Document
                  </a>
                </li>

                <span class="sentinel-nav-sep"></span>

                <li class="sentinel-nav-item {% if page.permalink == '/categories/' or page.categories contains 'categories' %}active{% endif %}">
                  <a href="{{ '/categories/' | relative_url }}">
                    <i class="fas fa-layer-group"></i> Categories
                  </a>
                </li>
                <li class="sentinel-nav-item {% if page.permalink == '/daily/' or page.categories contains 'daily' %}active{% endif %}">
                  <a href="{{ '/daily/' | relative_url }}">
                    <i class="fas fa-calendar"></i> Daily
                  </a>
                </li>
                <li class="sentinel-nav-item {% if page.permalink == '/newest/' %}active{% endif %}">
                  <a href="{{ '/newest' | relative_url }}">
                    <i class="fas fa-bolt"></i> Newest
                  </a>
                </li>

                <span class="sentinel-nav-sep"></span>

                <li class="sentinel-nav-item {% if page.permalink == '/about/' or page.categories contains 'about' %}active{% endif %}">
                  <a href="{{ '/about/' | relative_url }}">
                    <i class="fas fa-flask"></i> Research
                  </a>
                </li>
                <li class="sentinel-nav-item">
                  <a href="{{ '/feed.xml' | relative_url }}">
                    <i class="fas fa-rss"></i> RSS
                  </a>
                </li>

              {% endif %}

            </ul>
          </div>

          <!-- Right side -->
          <div class="sentinel-nav-right">
            <a href="{{ '/search' | relative_url }}" title="搜索"><i class="fas fa-search"></i></a>
            <a href="{{ '/changelog/' | relative_url }}" title="更新日志"><i class="fas fa-book"></i></a>
          </div>

        </div>
    </nav>
</div>
<script>
    (function(){
      var toggle = document.getElementById('sentinel-nav-toggle');
      var wrap   = document.getElementById('sentinel-nav-list-wrap');
      if(toggle && wrap){
        toggle.addEventListener('click', function(){
          wrap.classList.toggle('is-open');
          var icon = this.querySelector('i');
          icon.classList.toggle('fa-bars');
          icon.classList.toggle('fa-xmark');
        });
      }
    })();
</script>
