  <div class="prefers-cs" role="group" aria-label="切换颜色主题">
    <button class="prefers-cs-btn" data-pref="light" title="亮色模式">
      <i class="fas fa-sun"></i>
      <span class="prefers-cs-label">Light</span>
    </button>
    <button class="prefers-cs-btn" data-pref="auto" title="跟随系统">
      <i class="fas fa-circle-half-stroke"></i>
      <span class="prefers-cs-label">Auto</span>
    </button>
    <button class="prefers-cs-btn" data-pref="dark" title="暗色模式">
      <i class="fas fa-moon"></i>
      <span class="prefers-cs-label">Dark</span>
    </button>
  </div>
  
  <script>
  (function(){
    'use strict';
  
    var KEY  = 'prefers-color-scheme';
    var btns = document.querySelectorAll('.prefers-cs-btn');
  
    function getSystemTheme(){
      return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
  
    function applyTheme(theme){
      if(theme === 'auto'){
        theme = getSystemTheme();
      }
      document.documentElement.setAttribute('data-theme', theme);
    }
  
    function updateActiveState(pref){
      btns.forEach(function(b){
        b.classList.toggle('is-active', b.getAttribute('data-pref') === pref);
      });
    }
  
    // Init
    var saved = localStorage.getItem(KEY) || 'auto';
    applyTheme(saved);
    updateActiveState(saved);
  
    // Click handlers
    btns.forEach(function(btn){
      btn.addEventListener('click', function(){
        var pref = this.getAttribute('data-pref');
        localStorage.setItem(KEY, pref);
        applyTheme(pref);
        updateActiveState(pref);
      });
    });
  
    // System theme change
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){
      var current = localStorage.getItem(KEY) || 'auto';
      if(current === 'auto'){
        applyTheme('auto');
      }
    });
  })();
  </script>
