---
layout: index
---

<link rel="stylesheet" href="/assets/css/swiper-bundle.min.css">
<link rel="stylesheet" href="/assets/css/all.min.css">
<link rel="stylesheet" href="/assets/css/card-theater.css">


<main class="ct-wrapper">
  {% if site.harmony %}
  {% else %}
  <aside class="ct-sidebar">
    <span class="ct-tag" data-zh="{{ page.theater_tag_zh | default: page.theater_tag }}" data-en="{{ page.theater_tag }}">{{ page.theater_tag_zh | default: page.theater_tag }}</span>
    <div class="ct-title">{{ page.theater_title | default: "Card Theater" }}</div>
    <p class="ct-subtitle" data-zh="{{ page.theater_subtitle_zh | default: page.theater_subtitle }}" data-en="{{ page.theater_subtitle }}">{{ page.theater_subtitle_zh | default: page.theater_subtitle }}</p>
    <div class="ct-dots" id="ct-dots"></div>
    <div class="ct-info" id="ct-info">
      <div class="ct-info-title" id="ct-info-title"></div>
      <p class="ct-info-desc" id="ct-info-desc"></p>
      <div class="ct-info-note" id="ct-info-note"></div>
    </div>
    <button class="ct-mode-btn is-active" id="ct-mode-toggle">
      <span class="ct-mode-dot"></span>
      <span id="ct-mode-text">{{ page.mode_a_label | default: "切换英文模式" }}</span>
    </button>
  </aside>
  {% endif %}
  <div class="ct-stage">
    <div class="swiper ct-swiper">
      <div class="swiper-wrapper ct-swiper-center">{{ content }}</div>
    </div>
  </div>
</main>

<script src="/assets/js/swiper-bundle.min.js"></script>
<script>
(function(){
  /* ---- Bilingual slide data from front matter ---- */
  var slideData = [
    {% for slide in page.slide_data %}
    {
      title:   {{ slide.title   | jsonify }},
      desc:    {{ slide.desc    | jsonify }},
      desc_zh: {{ slide.desc_zh | default: slide.desc | jsonify }},
      note:    {{ slide.note    | jsonify }},
      note_zh: {{ slide.note_zh | default: slide.note | jsonify }}
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];

  var modeA = {{ page.mode_a_label | default: "切换英文模式" | jsonify }};
  var modeB = {{ page.mode_b_label | default: "SWITCH TO CHINESE MODE" | jsonify }};

  var currentLang = 'zh';

  var dotsBox   = document.getElementById('ct-dots');
  var infoEl    = document.getElementById('ct-info');
  var titleEl   = document.getElementById('ct-info-title');
  var descEl    = document.getElementById('ct-info-desc');
  var noteEl    = document.getElementById('ct-info-note');
  var toggleBtn = document.getElementById('ct-mode-toggle');
  var toggleTxt = document.getElementById('ct-mode-text');
  {% if site.harmony %}
  {% else %}
  /* ---- Build navigation dots ---- */
  slideData.forEach(function(_, i){
    var d = document.createElement('span');
    d.className = 'ct-dot' + (i === 0 ? ' is-active' : '');
    d.dataset.idx = i;
    d.addEventListener('click', function(){ if(window.ctSwiper) window.ctSwiper.slideTo(+this.dataset.idx); });
    dotsBox.appendChild(d);
  });
  /* ---- Update sidebar info panel (respects current language) ---- */
  function updateInfo(idx){
    if(!slideData[idx]) return;
    var d = slideData[idx];
    var isZh = currentLang === 'zh';
    infoEl.classList.remove('is-visible');
    setTimeout(function(){
      titleEl.textContent = d.title;
      descEl.textContent  = isZh ? d.desc_zh  : d.desc;
      noteEl.textContent  = isZh ? d.note_zh  : d.note;
      infoEl.classList.add('is-visible');
    }, 120);
  }
  function updateDots(idx){
    dotsBox.querySelectorAll('.ct-dot').forEach(function(d, i){
      d.classList.toggle('is-active', i === idx);
    });
  }
  {% endif %}
    /* ---- Copy link handler ---- */
  function copyToClipboard(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      return navigator.clipboard.writeText(text);
    }
    /* fallback */
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;left:-9999px;top:-9999px;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    return Promise.resolve();
  }

  document.addEventListener('click', function(e){
    var btn = e.target.closest('.ct-card__copy');
    if(!btn) return;
    var url = btn.dataset.url;
    if(!url) return;
    copyToClipboard(url).then(function(){
      btn.classList.add('is-copied');
      setTimeout(function(){ btn.classList.remove('is-copied'); }, 1500);
    });
  });
  
  /* ---- Apply language switch ---- */
  function applyLang(lang){
    currentLang = lang;
    var isZh = (lang === 'zh');

    /* Sidebar static text: elements carrying data-zh / data-en */
    document.querySelectorAll('[data-zh][data-en]').forEach(function(el){
      el.textContent = el.getAttribute('data-' + lang);
    });

    /* Card highlight labels: elements carrying data-hl-en / data-hl-zh */
    document.querySelectorAll('.swiper-slide').forEach(function(slide){
      var hl = slide.querySelector('.ct-card__highlight');
      var text = slide.getAttribute('data-hl-' + lang);
      if(hl && text) hl.textContent = text;
    });

    /* Refresh the info panel for the currently active slide */
    if(window.ctSwiper) updateInfo(window.ctSwiper.activeIndex);

    /* Toggle button state */
    toggleBtn.classList.toggle('is-active', isZh);
    toggleTxt.textContent = isZh ? modeA : modeB;
  }

  /* ---- Initialize Swiper ---- */
  window.ctSwiper = new Swiper('.ct-swiper',{
    effect:'coverflow',grabCursor:true,centeredSlides:true,slidesPerView:'auto',
    coverflowEffect:{rotate:0,stretch:0,depth:120,modifier:1.5,slideShadows:false},
    keyboard:{enabled:true},mousewheel:{thresholdDelta:30},speed:600,
    on:{
      slideChange:function(){
        updateInfo(this.activeIndex);
        updateDots(this.activeIndex);
      }
    }
  });

  updateInfo(0);
  infoEl.classList.add('is-visible');

  /* ---- Language toggle handler ---- */
  toggleBtn.addEventListener('click', function(){
    applyLang(currentLang === 'zh' ? 'en' : 'zh');
  });
})();
</script>
