  var monthNames = [&#39;&#39;,&#39;1月&#39;,&#39;2月&#39;,&#39;3月&#39;,&#39;4月&#39;,&#39;5月&#39;,&#39;6月&#39;,&#39;7月&#39;,&#39;8月&#39;,&#39;9月&#39;,&#39;10月&#39;,&#39;11月&#39;,&#39;12月&#39;];

  var dotsBox  = document.getElementById(&#39;cl-dots&#39;);
  var infoEl   = document.getElementById(&#39;cl-info&#39;);
  var infoTitle= document.getElementById(&#39;cl-info-title&#39;);
  var infoDesc = document.getElementById(&#39;cl-info-desc&#39;);
  var timeline = document.getElementById(&#39;cl-timeline&#39;);

  /* ── Build dots ── */
  yearsData.forEach(function(_, i){
    var d = document.createElement(&#39;span&#39;);
    d.className = &#39;cl-dot&#39; + (i === yearsData.length - 1 ? &#39; is-active&#39; : &#39;&#39;);
    d.dataset.idx = i;
    d.style.setProperty(&#39;--cl-year-color&#39;, yearsData[i].color);
    d.addEventListener(&#39;click&#39;, function(){
      if(window.clSwiper) window.clSwiper.slideTo(+this.dataset.idx);
    });
    dotsBox.appendChild(d);
  });

  /* ── Update dots ── */
  function updateDots(idx){
    dotsBox.querySelectorAll(&#39;.cl-dot&#39;).forEach(function(d, i){
      d.classList.toggle(&#39;is-active&#39;, i === idx);
    });
  }

  /* ── Update info panel ── */
  function updateInfo(idx){
    var y = yearsData[idx];
    if(!y) return;
    infoEl.classList.remove(&#39;is-visible&#39;);
    setTimeout(function(){
      infoTitle.textContent = y.year + &#39; · &#39; + y.highlight;
      infoDesc.textContent  = &#39;共 &#39; + y.entries.length + &#39; 条变更记录&#39;;
      infoEl.classList.add(&#39;is-visible&#39;);
    }, 100);
  }

  /* ── Update CSS custom property for active year color ── */
  function updateYearColor(color){
    document.documentElement.style.setProperty(&#39;--cl-year-color&#39;, color);
    document.documentElement.style.setProperty(&#39;--cl-line&#39;, color + &#39;30&#39;);
    /* Update dot colors */
    dotsBox.querySelectorAll(&#39;.cl-dot.is-active&#39;).forEach(function(d){
      d.style.background = color;
      d.style.boxShadow = &#39;0 0 8px &#39; + color + &#39;80&#39;;
    });
  }

  /* ── Render Timeline ── */
  function renderTimeline(idx){
    var y = yearsData[idx];
    if(!y) return;

    updateYearColor(y.color);

    /* Group by month */
    var months = {};
    y.entries.forEach(function(e){
      var m = e.date.split(&#39;/&#39;)[0];
      if(!months[m]) months[m] = [];
      months[m].push(e);
    });

    /* Sort months descending */
    var sorted = Object.keys(months).sort(function(a,b){ return b - a; });

    var html = &#39;&#39;;
    var delay = 0;

    sorted.forEach(function(m){
      var entries = months[m];
      html += &#39;&lt;div class=&quot;cl-month&quot;&gt;&#39;;
      html += &#39;&lt;div class=&quot;cl-month-head&quot;&gt;&#39;;
      html += &#39;&lt;span class=&quot;cl-month-dot&quot; style=&quot;background:&#39; + y.color + &#39;;box-shadow:0 0 10px &#39; + y.color + &#39;60&quot;&gt;&lt;/span&gt;&#39;;
      html += &#39;&lt;span class=&quot;cl-month-label&quot; style=&quot;color:&#39; + y.color + &#39;&quot;&gt;&#39; + monthNames[parseInt(m)] + &#39;&lt;/span&gt;&#39;;
      html += &#39;&lt;span class=&quot;cl-month-count&quot;&gt;&#39; + entries.length + &#39; 条&lt;/span&gt;&#39;;
      html += &#39;&lt;/div&gt;&#39;;

      entries.forEach(function(e){
        var day = e.date.split(&#39;/&#39;)[1];
        html += &#39;&lt;div class=&quot;cl-entry&quot; style=&quot;animation-delay:&#39; + delay + &#39;s&quot;&gt;&#39;;
        html += &#39;&lt;span class=&quot;cl-entry-dot&quot;&gt;&lt;/span&gt;&#39;;
        html += &#39;&lt;span class=&quot;cl-entry-date&quot;&gt;&#39; + m + &#39;/&#39; + day + &#39;&lt;/span&gt;&#39;;
        html += &#39;&lt;span class=&quot;cl-entry-text&quot;&gt;&#39; + escHtml(e.text) + &#39;&lt;/span&gt;&#39;;
        if(e.link){
          html += &#39;&lt;a class=&quot;cl-entry-link&quot; href=&quot;&#39; + escHtml(e.link) + &#39;&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;&#39; + escHtml(e.linkLabel || &#39;Link&#39;) + &#39;&lt;/a&gt;&#39;;
        }
        html += &#39;&lt;/div&gt;&#39;;
        delay += 0.04;
      });

      html += &#39;&lt;/div&gt;&#39;;
    });

    /* Animate transition */
    timeline.classList.add(&#39;is-switching&#39;);
    setTimeout(function(){
      timeline.innerHTML = html;
      timeline.classList.remove(&#39;is-switching&#39;);
    }, 300);
  }

  function escHtml(s){
    if(!s) return &#39;&#39;;
    var d = document.createElement(&#39;div&#39;);
    d.appendChild(document.createTextNode(s));
    return d.innerHTML;
  }

  /* ── Init Swiper ── */
  var initialIdx = yearsData.length - 1;
  window.clSwiper = new Swiper(&#39;.cl-swiper&#39;,{
    effect: &#39;coverflow&#39;,
    grabCursor: true,
    centeredSlides: true,
    slidesPerView: &#39;auto&#39;,
    coverflowEffect: {
      rotate: 0,
      stretch: 0,
      depth: 80,
      modifier: 1.2,
      slideShadows: false
    },
    keyboard: { enabled: true },
    mousewheel: { thresholdDelta: 30 },
    speed: 600,
    initialSlide: initialIdx,
    on: {
      slideChange: function(){
        updateDots(this.activeIndex);
        updateInfo(this.activeIndex);
        renderTimeline(this.activeIndex);
      }
    }
  });

  /* Initial render */
  updateDots(initialIdx);
  updateInfo(initialIdx);
  infoEl.classList.add(&#39;is-visible&#39;);
  renderTimeline(initialIdx);

})();

  var monthNames = ['','1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

  var dotsBox  = document.getElementById('cl-dots');
  var infoEl   = document.getElementById('cl-info');
  var infoTitle= document.getElementById('cl-info-title');
  var infoDesc = document.getElementById('cl-info-desc');
  var timeline = document.getElementById('cl-timeline');

  /* ── Build dots ── */
  yearsData.forEach(function(_, i){
    var d = document.createElement('span');
    d.className = 'cl-dot' + (i === yearsData.length - 1 ? ' is-active' : '');
    d.dataset.idx = i;
    d.style.setProperty('--cl-year-color', yearsData[i].color);
    d.addEventListener('click', function(){
      if(window.clSwiper) window.clSwiper.slideTo(+this.dataset.idx);
    });
    dotsBox.appendChild(d);
  });

  /* ── Update dots ── */
  function updateDots(idx){
    dotsBox.querySelectorAll('.cl-dot').forEach(function(d, i){
      d.classList.toggle('is-active', i === idx);
    });
  }

  /* ── Update info panel ── */
  function updateInfo(idx){
    var y = yearsData[idx];
    if(!y) return;
    infoEl.classList.remove('is-visible');
    setTimeout(function(){
      infoTitle.textContent = y.year + ' · ' + y.highlight;
      infoDesc.textContent  = '共 ' + y.entries.length + ' 条变更记录';
      infoEl.classList.add('is-visible');
    }, 100);
  }

  /* ── Update CSS custom property for active year color ── */
  function updateYearColor(color){
    document.documentElement.style.setProperty('--cl-year-color', color);
    document.documentElement.style.setProperty('--cl-line', color + '30');
    /* Update dot colors */
    dotsBox.querySelectorAll('.cl-dot.is-active').forEach(function(d){
      d.style.background = color;
      d.style.boxShadow = '0 0 8px ' + color + '80';
    });
  }

  /* ── Render Timeline ── */
  function renderTimeline(idx){
    var y = yearsData[idx];
    if(!y) return;

    updateYearColor(y.color);

    /* Group by month */
    var months = {};
    y.entries.forEach(function(e){
      var m = e.date.split('/')[0];
      if(!months[m]) months[m] = [];
      months[m].push(e);
    });

    /* Sort months descending */
    var sorted = Object.keys(months).sort(function(a,b){ return b - a; });

    var html = '';
    var delay = 0;

    sorted.forEach(function(m){
      var entries = months[m];
      html += '<div class="cl-month">';
      html += '<div class="cl-month-head">';
      html += '<span class="cl-month-dot" style="background:' + y.color + ';box-shadow:0 0 10px ' + y.color + '60"></span>';
      html += '<span class="cl-month-label" style="color:' + y.color + '">' + monthNames[parseInt(m)] + '</span>';
      html += '<span class="cl-month-count">' + entries.length + ' 条</span>';
      html += '</div>';

      entries.forEach(function(e){
        var day = e.date.split('/')[1];
        html += '<div class="cl-entry" style="animation-delay:' + delay + 's">';
        html += '<span class="cl-entry-dot"></span>';
        html += '<span class="cl-entry-date">' + m + '/' + day + '</span>';
        html += '<span class="cl-entry-text">' + escHtml(e.text) + '</span>';
        if(e.link){
          html += '<a class="cl-entry-link" href="' + escHtml(e.link) + '" target="_blank" rel="noopener">' + escHtml(e.linkLabel || 'Link') + '</a>';
        }
        html += '</div>';
        delay += 0.04;
      });

      html += '</div>';
    });

    /* Animate transition */
    timeline.classList.add('is-switching');
    setTimeout(function(){
      timeline.innerHTML = html;
      timeline.classList.remove('is-switching');
    }, 300);
  }

  function escHtml(s){
    if(!s) return '';
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(s));
    return d.innerHTML;
  }

  /* ── Init Swiper ── */
  var initialIdx = yearsData.length - 1;
  window.clSwiper = new Swiper('.cl-swiper',{
    effect: 'coverflow',
    grabCursor: true,
    centeredSlides: true,
    slidesPerView: 'auto',
    coverflowEffect: {
      rotate: 0,
      stretch: 0,
      depth: 80,
      modifier: 1.2,
      slideShadows: false
    },
    keyboard: { enabled: true },
    mousewheel: { thresholdDelta: 30 },
    speed: 600,
    initialSlide: initialIdx,
    on: {
      slideChange: function(){
        updateDots(this.activeIndex);
        updateInfo(this.activeIndex);
        renderTimeline(this.activeIndex);
      }
    }
  });

  /* Initial render */
  updateDots(initialIdx);
  updateInfo(initialIdx);
  infoEl.classList.add('is-visible');
  renderTimeline(initialIdx);

})();
</script>
    </body>
</html>
