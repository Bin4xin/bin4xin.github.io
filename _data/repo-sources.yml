- id: "centos-7"
  name: "CentOS 7"
  icon: "fa-brands fa-redhat"
  color: "#932279"
  config_file: "/etc/yum.repos.d/CentOS-Base.repo"
  note: "CentOS 7 已于 2024-06-30 EOL，官方源已迁移至 vault.centos.org"
  mirrors:
    - id: "tuna"
      name: "清华 TUNA"
      tag: "MIRROR"
      steps:
        - label: "备份原有配置"
          cmd: "sudo cp /etc/yum.repos.d/CentOS-Base.repo /etc/yum.repos.d/CentOS-Base.repo.bak"
        - label: "替换软件源"
          cmd: "sudo wget -O /etc/yum.repos.d/CentOS-Base.repo https://mirrors.tuna.tsinghua.edu.cn/repo/Centos-7.repo"
        - label: "清理并重建缓存"
          cmd: "sudo yum clean all && sudo yum makecache"
    - id: "aliyun"
      name: "阿里云"
      tag: "MIRROR"
      steps:
        - label: "备份原有配置"
          cmd: "sudo cp /etc/yum.repos.d/CentOS-Base.repo /etc/yum.repos.d/CentOS-Base.repo.bak"
        - label: "替换软件源"
          cmd: "sudo wget -O /etc/yum.repos.d/CentOS-Base.repo https://mirrors.aliyun.com/repo/Centos-7.repo"
        - label: "清理并重建缓存"
          cmd: "sudo yum clean all && sudo yum makecache"
    - id: "ustc"
      name: "中科大 USTC"
      tag: "MIRROR"
      steps:
        - label: "备份原有配置"
          cmd: "sudo cp /etc/yum.repos.d/CentOS-Base.repo /etc/yum.repos.d/CentOS-Base.repo.bak"
        - label: "替换软件源"
          cmd: "sudo wget -O /etc/yum.repos.d/CentOS-Base.repo https://mirrors.ustc.edu.cn/repo/Centos-7.repo"
        - label: "清理并重建缓存"
          cmd: "sudo yum clean all && sudo yum makecache"

- id: "fedora-40"
  name: "Fedora 40"
  icon: "fa-brands fa-fedora"
  color: "#294172"
  config_file: "/etc/yum.repos.d/fedora.repo"
  mirrors:
    - id: "official"
      name: "Fedora 官方"
      tag: "OFFICIAL"
      steps:
        - label: "备份原有配置"
          cmd: "sudo cp /etc/yum.repos.d/fedora.repo /etc/yum.repos.d/fedora.repo.bak && sudo cp /etc/yum.repos.d/fedora-updates.repo /etc/yum.repos.d/fedora-updates.repo.bak"
        - label: "启用官方 baseurl"
          cmd: "sudo sed -i -e 's|^metalink=|#metalink=|g' -e 's|^#baseurl=https://download.example/pub/fedora/linux|baseurl=https://download.fedoraproject.org/pub/fedora/linux|g' /etc/yum.repos.d/fedora*.repo"
        - label: "重建缓存"
          cmd: "sudo dnf makecache"
    - id: "tuna"
      name: "清华 TUNA"
      tag: "MIRROR"
      steps:
        - label: "备份原有配置"
          cmd: "sudo cp /etc/yum.repos.d/fedora.repo /etc/yum.repos.d/fedora.repo.bak && sudo cp /etc/yum.repos.d/fedora-updates.repo /etc/yum.repos.d/fedora-updates.repo.bak"
        - label: "禁用 metalink，启用镜像 baseurl"
          cmd: "sudo sed -i -e 's|^metalink=|#metalink=|g' -e 's|^#baseurl=https://download.example/pub/fedora/linux|baseurl=https://mirrors.tuna.tsinghua.edu.cn/fedora|g' /etc/yum.repos.d/fedora*.repo"
        - label: "重建缓存"
          cmd: "sudo dnf makecache"
    - id: "aliyun"
      name: "阿里云"
      tag: "MIRROR"
      steps:
        - label: "备份原有配置"
          cmd: "sudo cp /etc/yum.repos.d/fedora.repo /etc/yum.repos.d/fedora.repo.bak && sudo cp /etc/yum.repos.d/fedora-updates.repo /etc/yum.repos.d/fedora-updates.repo.bak"
        - label: "禁用 metalink，启用镜像 baseurl"
          cmd: "sudo sed -i -e 's|^metalink=|#metalink=|g' -e 's|^#baseurl=https://download.example/pub/fedora/linux|baseurl=https://mirrors.aliyun.com/fedora|g' /etc/yum.repos.d/fedora*.repo"
        - label: "重建缓存"
          cmd: "sudo dnf makecache"
    - id: "ustc"
      name: "中科大 USTC"
      tag: "MIRROR"
      steps:
        - label: "备份原有配置"
          cmd: "sudo cp /etc/yum.repos.d/fedora.repo /etc/yum.repos.d/fedora.repo.bak && sudo cp /etc/yum.repos.d/fedora-updates.repo /etc/yum.repos.d/fedora-updates.repo.bak"
        - label: "禁用 metalink，启用镜像 baseurl"
          cmd: "sudo sed -i -e 's|^metalink=|#metalink=|g' -e 's|^#baseurl=https://download.example/pub/fedora/linux|baseurl=https://mirrors.ustc.edu.cn/fedora|g' /etc/yum.repos.d/fedora*.repo"
        - label: "重建缓存"
          cmd: "sudo dnf makecache"

- id: "arch"
  name: "Arch Linux"
  icon: "fa-brands fa-linux"
  color: "#1793d1"
  config_file: "/etc/pacman.d/mirrorlist"
  mirrors:
    - id: "tuna"
      name: "清华 TUNA"
      tag: "MIRROR"
      steps:
        - label: "备份原有镜像列表"
          cmd: "sudo cp /etc/pacman.d/mirrorlist /etc/pacman.d/mirrorlist.bak"
        - label: "写入 TUNA 镜像"
          cmd: "echo 'Server = https://mirrors.tuna.tsinghua.edu.cn/archlinux/$repo/os/$arch' | sudo tee /etc/pacman.d/mirrorlist"
        - label: "同步软件包数据库"
          cmd: "sudo pacman -Syyu"
    - id: "aliyun"
      name: "阿里云"
      tag: "MIRROR"
      steps:
        - label: "备份原有镜像列表"
          cmd: "sudo cp /etc/pacman.d/mirrorlist /etc/pacman.d/mirrorlist.bak"
        - label: "写入阿里云镜像"
          cmd: "echo 'Server = https://mirrors.aliyun.com/archlinux/$repo/os/$arch' | sudo tee /etc/pacman.d/mirrorlist"
        - label: "同步软件包数据库"
          cmd: "sudo pacman -Syyu"
    - id: "ustc"
      name: "中科大 USTC"
      tag: "MIRROR"
      steps:
        - label: "备份原有镜像列表"
          cmd: "sudo cp /etc/pacman.d/mirrorlist /etc/pacman.d/mirrorlist.bak"
        - label: "写入 USTC 镜像"
          cmd: "echo 'Server = https://mirrors.ustc.edu.cn/archlinux/$repo/os/$arch' | sudo tee /etc/pacman.d/mirrorlist"
        - label: "同步软件包数据库"
          cmd: "sudo pacman -Syyu"

- id: "opensuse-leap"
  name: "openSUSE Leap"
  icon: "fa-brands fa-suse"
  color: "#73ba25"
  config_file: "/etc/zypp/repos.d/*.repo"
  mirrors:
    - id: "tuna"
      name: "清华 TUNA"
      tag: "MIRROR"
      steps:
        - label: "备份所有 repo 文件"
          cmd: "sudo cp -r /etc/zypp/repos.d /etc/zypp/repos.d.bak"
        - label: "替换为 TUNA 镜像"
          cmd: "sudo sed -i 's|download.opensuse.org|mirrors.tuna.tsinghua.edu.cn/opensuse|g' /etc/zypp/repos.d/*.repo"
        - label: "刷新仓库"
          cmd: "sudo zypper refresh"
    - id: "aliyun"
      name: "阿里云"
      tag: "MIRROR"
      steps:
        - label: "备份所有 repo 文件"
          cmd: "sudo cp -r /etc/zypp/repos.d /etc/zypp/repos.d.bak"
        - label: "替换为阿里云镜像"
          cmd: "sudo sed -i 's|download.opensuse.org|mirrors.aliyun.com/opensuse|g' /etc/zypp/repos.d/*.repo"
        - label: "刷新仓库"
          cmd: "sudo zypper refresh"
    - id: "ustc"
      name: "中科大 USTC"
      tag: "MIRROR"
      steps:
        - label: "备份所有 repo 文件"
          cmd: "sudo cp -r /etc/zypp/repos.d /etc/zypp/repos.d.bak"
        - label: "替换为 USTC 镜像"
          cmd: "sudo sed -i 's|download.opensuse.org|mirrors.ustc.edu.cn/opensuse|g' /etc/zypp/repos.d/*.repo"
        - label: "刷新仓库"
          cmd: "sudo zypper refresh"

