- id: "ubuntu-2204"
  name: "Ubuntu 22.04"
  icon: "fa-brands fa-ubuntu"
  color: "#e95420"
  config_file: "/etc/apt/sources.list"
  mirrors:
    - id: "official"
      name: "官方"
      tag: "OFFICIAL"
      steps:
        - label: "备份原有配置"
          cmd: "sudo cp /etc/apt/sources.list /etc/apt/sources.list.bak"
        - label: "还原为官方源"
          cmd: "sudo sed -i 's|https://mirrors\\.\\S*ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list"
        - label: "还原 security 源"
          cmd: "sudo sed -i 's|https://mirrors\\.\\S*ubuntu|http://security.ubuntu.com/ubuntu|g' /etc/apt/sources.list"
        - label: "更新软件缓存"
          cmd: "sudo apt update"
    - id: "tuna"
      name: "清华 TUNA"
      tag: "MIRROR"
      steps:
        - label: "备份原有配置"
          cmd: "sudo cp /etc/apt/sources.list /etc/apt/sources.list.bak"
        - label: "替换 archive 源"
          cmd: "sudo sed -i 's|http://archive.ubuntu.com/ubuntu|https://mirrors.tuna.tsinghua.edu.cn/ubuntu|g' /etc/apt/sources.list"
        - label: "替换 security 源"
          cmd: "sudo sed -i 's|http://security.ubuntu.com/ubuntu|https://mirrors.tuna.tsinghua.edu.cn/ubuntu|g' /etc/apt/sources.list"
        - label: "更新软件缓存"
          cmd: "sudo apt update"
    - id: "aliyun"
      name: "阿里云"
      tag: "MIRROR"
      steps:
        - label: "备份原有配置"
          cmd: "sudo cp /etc/apt/sources.list /etc/apt/sources.list.bak"
        - label: "替换 archive 源"
          cmd: "sudo sed -i 's|http://archive.ubuntu.com/ubuntu|https://mirrors.aliyun.com/ubuntu|g' /etc/apt/sources.list"
        - label: "替换 security 源"
          cmd: "sudo sed -i 's|http://security.ubuntu.com/ubuntu|https://mirrors.aliyun.com/ubuntu|g' /etc/apt/sources.list"
        - label: "更新软件缓存"
          cmd: "sudo apt update"
    - id: "ustc"
      name: "中科大 USTC"
      tag: "MIRROR"
      steps:
        - label: "备份原有配置"
          cmd: "sudo cp /etc/apt/sources.list /etc/apt/sources.list.bak"
        - label: "替换 archive 源"
          cmd: "sudo sed -i 's|http://archive.ubuntu.com/ubuntu|https://mirrors.ustc.edu.cn/ubuntu|g' /etc/apt/sources.list"
        - label: "替换 security 源"
          cmd: "sudo sed -i 's|http://security.ubuntu.com/ubuntu|https://mirrors.ustc.edu.cn/ubuntu|g' /etc/apt/sources.list"
        - label: "更新软件缓存"
          cmd: "sudo apt update"

